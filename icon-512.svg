<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Document icon (scaled up) -->
  <g transform="translate(128, 100)">
    <!-- Paper -->
    <rect x="0" y="0" width="256" height="320" rx="20" fill="white" opacity="0.95"/>
    
    <!-- Folded corner -->
    <path d="M 200 0 L 256 56 L 200 56 Z" fill="#e8eaed"/>
    
    <!-- Lines representing text -->
    <rect x="42" y="94" width="172" height="16" rx="8" fill="#1a73e8" opacity="0.7"/>
    <rect x="42" y="134" width="140" height="16" rx="8" fill="#1a73e8" opacity="0.5"/>
    <rect x="42" y="174" width="160" height="16" rx="8" fill="#1a73e8" opacity="0.5"/>
    <rect x="42" y="214" width="128" height="16" rx="8" fill="#1a73e8" opacity="0.5"/>
    <rect x="42" y="254" width="150" height="16" rx="8" fill="#1a73e8" opacity="0.5"/>
  </g>
  
  <!-- Small wrench icon (for vehicle repair) -->
  <g transform="translate(364, 364) scale(1.8)">
    <path d="M 0 -20 L 6 -14 L -8 8 L -14 2 Z" fill="#ffd700" stroke="#f9a825" stroke-width="1.5"/>
    <circle cx="-10" cy="4" r="3" fill="#f9a825"/>
  </g>
</svg>