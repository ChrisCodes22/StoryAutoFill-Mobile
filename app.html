<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b2545">
    <title>Story Template — Blue Stack Labs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #cdd9ea;          /* soft blue field — clearly deeper than the cards */
            --surface: #ffffff;      /* card face */
            --inset: #eaf0f9;        /* wells: stat tiles, search, hover */
            --ink: #16212e;          /* primary text — deep slate, softer than pure black */
            --ink-2: #435063;        /* secondary text */
            --muted: #667589;        /* muted but still readable */
            --line: #c0cee1;         /* visible hairline on light surfaces */
            --navy: #0b2545;
            --navy-2: #13315c;
            --accent: #2a6fd0;       /* brand blue for titles, accents, focus */
            --accent-soft: #e4eefb;
            --red: #b42318;
            --radius: 14px;
            --shadow: 0 2px 4px rgba(16,32,64,.06), 0 8px 24px rgba(16,32,64,.07);
            --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Brand wordmark — matches marketing site + admin portal */
        .wordmark {
            font-family: 'Orbitron', var(--sans);
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #4aa8ff, #00c8ff);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #4aa8ff;
            white-space: nowrap;
        }

        /* App header band */
        .appbar {
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 56px),
                linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .appbar .wordmark { font-size: 18px; display: block; }
        .appbar small { font-size: 12px; color: rgba(255,255,255,.6); font-weight: 500; }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 18px 16px 28px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat {
            flex: 1;
            background: var(--inset);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -.02em;
            color: var(--navy-2);
            font-variant-numeric: tabular-nums;
        }
        .stat-label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink-2);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: .03em;
        }

        .search-container { margin-bottom: 12px; }
        .search-input {
            width: 100%;
            padding: 13px 14px;
            font-size: 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--ink);
            background: var(--inset);
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        .search-input::placeholder { color: var(--muted); }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 14px;
            font-size: 16px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            resize: vertical;
            color: var(--ink);
            line-height: 1.55;
            font-family: var(--sans);
            margin-bottom: 14px;
            background: var(--accent-soft);
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .templates-list {
            max-height: 44vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -18px -18px;
        }
        .template-item {
            padding: 15px 18px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background .15s;
        }
        .template-item:last-child { border-bottom: none; }
        .template-item:active,
        .template-item:hover { background: var(--accent-soft); }
        .template-title {
            font-weight: 700;
            color: var(--navy-2);
            margin-bottom: 4px;
            font-size: 15.5px;
            letter-spacing: -.005em;
        }
        .template-preview {
            font-size: 13px;
            color: var(--ink-2);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--navy-2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--sans);
            cursor: pointer;
            transition: filter .15s, transform .05s;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: translateY(1px); }
        .btn-accent { background: var(--accent); }

        .empty-state {
            text-align: center;
            padding: 36px 20px;
            color: var(--muted);
            font-size: 14px;
        }

        /* License gate */
        .license-overlay {
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 56px),
                linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .license-modal {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(4,14,32,.5);
        }
        .license-brand { margin-bottom: 22px; }
        .license-brand .wordmark { font-size: 20px; display: block; }
        .license-brand small { font-size: 12px; color: var(--muted); font-weight: 500; }
        .license-modal h2 {
            color: var(--ink);
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: 700;
        }
        .license-modal .lead {
            color: var(--ink-2);
            margin-bottom: 18px;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .license-input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 15px;
            font-family: var(--mono);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            transition: border-color .15s, box-shadow .15s;
        }
        .license-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .license-error {
            color: var(--red);
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
        .license-foot {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.5;
        }

        .hidden { display: none !important; }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <!-- License Overlay -->
    <div id="licenseOverlay" class="license-overlay">
        <div class="license-modal">
            <div class="license-brand">
                <span class="wordmark">BLUE STACK LABS</span>
                <small>Story Template</small>
            </div>
            <h2>Enter your license key</h2>
            <p class="lead">Activate once on this device to start using your templates.</p>
            <input type="text" id="licenseInput" class="license-input" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX-XXXX" maxlength="34" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <div id="licenseError" class="license-error"></div>
            <button class="btn" onclick="activateLicense()">Activate</button>
            <p class="license-foot">Need a key? Contact info@bluestacklabs.software</p>
        </div>
    </div>

    <!-- Main App (Hidden until licensed) -->
    <div id="mainApp" class="hidden">
        <header class="appbar">
            <span class="wordmark">BLUE STACK LABS</span>
            <small>Story Template · tap a template to insert</small>
        </header>
        <div class="container">
            <div class="card">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="templateCount">0</div>
                        <div class="stat-label">Templates</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="searchResults">0</div>
                        <div class="stat-label">Results</div>
                    </div>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search templates…">
                </div>

                <div class="templates-list" id="templatesList"></div>
            </div>

            <div class="card">
                <div class="card-title">Your story</div>
                <textarea id="storyText" placeholder="Tap a template above to insert it here…"></textarea>
                <button class="btn btn-accent" onclick="copyToClipboard()">Copy to clipboard</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // LICENSE SYSTEM (HEX-ENCODED)
        // ========================================
        const LICENSE_CONFIG = {
            licenseKey: 'stl_mobile_license',
            encryptionSalt: 'STL2026'
        };

        function encryptKey(key) {
            return btoa(key.split('').reverse().join(''));
        }

        function decryptKey(encrypted) {
            try {
                return atob(encrypted).split('').reverse().join('');
            } catch {
                return null;
            }
        }

        function validateLicenseKey(key) {
            if (!key || typeof key !== 'string') {
                return { valid: false, reason: 'Invalid key format' };
            }

            const cleanKey = key.replace(/-/g, '').toUpperCase();
            
            // Must be exactly 28 hex characters (0-9, A-F)
            if (!/^[A-F0-9]{28}$/.test(cleanKey)) {
                return { valid: false, reason: 'Invalid key format. Key must be 28 hex characters (0-9, A-F).' };
            }

            try {
                // Decode from hex
                let decoded = '';
                for (let i = 0; i < cleanKey.length; i += 2) {
                    const hex = cleanKey.substr(i, 2);
                    decoded += String.fromCharCode(parseInt(hex, 16));
                }
                
                // Expected format: "JOH:1739318400"
                if (!decoded.includes(':')) {
                    return { valid: false, reason: 'Invalid license key structure' };
                }

                const parts = decoded.split(':');
                const userId = parts[0];
                const expiryStr = parts[1];
                
                if (!userId || userId.length < 2) {
                    return { valid: false, reason: 'Invalid license key' };
                }

                // Parse expiry timestamp
                let expiryDate;
                
                if (/^\d+$/.test(expiryStr)) {
                    expiryDate = new Date(parseInt(expiryStr) * 1000);
                } else {
                    expiryDate = new Date(expiryStr);
                }
                
                if (isNaN(expiryDate.getTime())) {
                    return { valid: false, reason: 'Invalid license expiration date' };
                }

                const now = new Date();
                
                if (expiryDate < now) {
                    return { 
                        valid: false, 
                        reason: 'License expired on ' + expiryDate.toLocaleDateString(),
                        expiry: expiryDate, 
                        userId: userId 
                    };
                }

                return { 
                    valid: true, 
                    userId: userId, 
                    expiry: expiryDate 
                };

            } catch (e) {
                console.error('License validation error:', e);
                return { valid: false, reason: 'Invalid license key data' };
            }
        }

        function storeLicense(key) {
            localStorage.setItem(LICENSE_CONFIG.licenseKey, encryptKey(key));
            _cachedUserInfo = null;
            localStorage.removeItem(TRACKING_CONFIG.techNameKey);
        }

        function getStoredLicense() {
            const encrypted = localStorage.getItem(LICENSE_CONFIG.licenseKey);
            return encrypted ? decryptKey(encrypted) : null;
        }

        function checkLicense() {
            const stored = getStoredLicense();
            
            if (!stored) {
                return false;
            }

            const validation = validateLicenseKey(stored);
            
            if (!validation.valid) {
                localStorage.removeItem(LICENSE_CONFIG.licenseKey);
                return false;
            }

            console.log('License valid until:', validation.expiry.toLocaleDateString());
            return true;
        }

        function activateLicense() {
            const input = document.getElementById('licenseInput');
            const error = document.getElementById('licenseError');
            const key = input.value.replace(/-/g, '').toUpperCase();
            
            if (key.length !== 28) {
                error.textContent = '❌ License key must be 28 characters';
                error.style.display = 'block';
                input.style.borderColor = '#dc3545';
                return;
            }

            const validation = validateLicenseKey(key);
            
            if (validation.valid) {
                storeLicense(input.value);
                document.getElementById('licenseOverlay').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                initializeApp();
            } else {
                error.textContent = `❌ ${validation.reason}`;
                error.style.display = 'block';
                input.style.borderColor = '#dc3545';
            }
        }

        // Format license input
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('licenseInput');
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^A-F0-9]/gi, '').toUpperCase();
                if (value.length > 28) value = value.substring(0, 28);
                
                // Format as XXXXXX-XXXXXX-XXXXXX-XXXXXX-XXXX
                let formatted = '';
                for (let i = 0; i < value.length; i++) {
                    if (i === 6 || i === 12 || i === 18 || i === 24) formatted += '-';
                    formatted += value[i];
                }
                
                e.target.value = formatted;
                e.target.style.borderColor = '#e0e0e0';
                document.getElementById('licenseError').style.display = 'none';
            });
        });

        // ========================================
        // USAGE TRACKING (mirrors desktop extension)
        // ========================================
        const TRACKING_CONFIG = {
            endpoint: 'https://script.google.com/macros/s/AKfycbwA8DN_VtQp-UWQdUecQXgyTxAOShMgUpv53RpQfLCbkmXr-6MJ0A-69FHH6NeSSY_t/exec',
            storageKey: 'stl_usage_count',
            techNameKey: 'stl_tech_name',
            fingerprintKey: 'stl_device_fingerprint'
        };

        let _cachedUserInfo = null;

        function generateDeviceFingerprint() {
            try {
                const stored = localStorage.getItem(TRACKING_CONFIG.fingerprintKey);
                if (stored) return stored;

                const nav = window.navigator;
                const scr = window.screen;
                const components = [
                    nav.userAgent,
                    nav.language,
                    scr.colorDepth,
                    scr.width + 'x' + scr.height,
                    new Date().getTimezoneOffset(),
                    nav.hardwareConcurrency || 'unknown',
                    nav.platform,
                    // Stable marker so the admin portal can tell mobile from desktop
                    // even on iPads (which report a desktop user agent). Same column
                    // format as desktop — just an extra token inside the hash.
                    'mobile-pwa'
                ];
                const fingerprint = btoa(components.join('|'));
                localStorage.setItem(TRACKING_CONFIG.fingerprintKey, fingerprint);
                return fingerprint;
            } catch (e) {
                return 'unknown';
            }
        }

        function getUserInfo() {
            if (_cachedUserInfo) return _cachedUserInfo;
            const storedKey = getStoredLicense();
            const storedName = localStorage.getItem(TRACKING_CONFIG.techNameKey);
            const validation = storedKey ? validateLicenseKey(storedKey) : null;
            _cachedUserInfo = {
                key: storedKey || 'none',
                name: storedName || (validation && validation.valid ? validation.userId : 'unknown'),
                fingerprint: generateDeviceFingerprint() || 'unknown'
            };
            return _cachedUserInfo;
        }

        function logUsage(templateTitle) {
            try {
                // Skip only when no real endpoint is configured
                if (!TRACKING_CONFIG.endpoint || !TRACKING_CONFIG.endpoint.startsWith('https://')) return;

                const user = getUserInfo();

                try {
                    const count = parseInt(localStorage.getItem(TRACKING_CONFIG.storageKey) || '0', 10) + 1;
                    localStorage.setItem(TRACKING_CONFIG.storageKey, String(count));
                } catch (e) {}

                // no-cors + text/plain: Apps Script answers POST with a 302 redirect,
                // which drops the body under default fetch mode / application/json
                fetch(TRACKING_CONFIG.endpoint, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'logUsage',
                        licenseKey: user.key,
                        userId: user.name,
                        techName: user.name,
                        template: String(templateTitle || 'unknown').substring(0, 200),
                        timestamp: new Date().toISOString(),
                        deviceFingerprint: user.fingerprint
                    })
                }).catch(() => {});
            } catch (err) {
                // Silent fail — tracking must never break template use
            }
        }

        async function lookupAndStoreTechName(key) {
            if (!TRACKING_CONFIG.endpoint || !TRACKING_CONFIG.endpoint.startsWith('https://')) return;
            try {
                const cleanKey = key.replace(/-/g, '').toUpperCase();
                const resp = await fetch(TRACKING_CONFIG.endpoint + '?action=lookupByKey&key=' + encodeURIComponent(cleanKey));
                const json = await resp.json();
                if (json.found && json.techName) {
                    localStorage.setItem(TRACKING_CONFIG.techNameKey, json.techName);
                    _cachedUserInfo = null;
                    console.log('[Story Template] Tech name retrieved:', json.techName);
                }
            } catch (e) {
                console.log('[Story Template] Name lookup failed (non-critical)');
            }
        }

        // ========================================
        // TEMPLATE SYSTEM
        // ========================================
        let templates = [];
        let filteredTemplates = [];

        async function loadTemplates() {
            try {
                const response = await fetch('https://templates.bluestacklabs.software/templates.json');
                const data = await response.json();
                templates = data.templates;
                filteredTemplates = templates;
                console.log('Loaded', templates.length, 'templates');
                updateStats();
                renderTemplates();
            } catch (error) {
                console.error('Failed to load templates:', error);
                document.getElementById('templatesList').innerHTML = '<div class="empty-state">❌ Failed to load templates</div>';
            }
        }

        function searchTemplates(query) {
            if (!query) {
                filteredTemplates = templates;
            } else {
                const q = query.toLowerCase();
                filteredTemplates = templates.filter(t => 
                    t.title.toLowerCase().includes(q) ||
                    t.keywords.some(k => k.toLowerCase().includes(q)) ||
                    t.body.toLowerCase().includes(q)
                );
            }
            updateStats();
            renderTemplates();
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderTemplates() {
            const list = document.getElementById('templatesList');

            if (filteredTemplates.length === 0) {
                list.innerHTML = '<div class="empty-state">No templates found</div>';
                return;
            }

            // Use data-index instead of inline onclick — titles with quotes or
            // special characters used to break the handler and made those items untappable.
            list.innerHTML = filteredTemplates.map((template, i) => `
                <div class="template-item" data-index="${i}" role="button" tabindex="0">
                    <div class="template-title">${escapeHtml(template.title)}</div>
                    <div class="template-preview">${escapeHtml(template.body.substring(0, 80))}…</div>
                </div>
            `).join('');
        }

        // One delegated listener handles every template tap reliably
        document.addEventListener('DOMContentLoaded', () => {
            const list = document.getElementById('templatesList');
            if (!list) return;
            list.addEventListener('click', (e) => {
                const item = e.target.closest('.template-item');
                if (item) insertTemplate(parseInt(item.dataset.index, 10));
            });
        });

        function insertTemplate(index) {
            const template = filteredTemplates[index];
            if (!template) return;

            // Replace, don't append — each template is a complete story, so the
            // previous one is cleared out when a new one is inserted.
            const textarea = document.getElementById('storyText');
            textarea.value = template.body;

            textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            showNotification('✅ Template inserted');

            // Best-effort usage ping — never blocks the insert
            logUsage(template.title);
        }

        function updateStats() {
            document.getElementById('templateCount').textContent = templates.length;
            document.getElementById('searchResults').textContent = filteredTemplates.length;
        }

        async function copyText(text) {
            // Modern async Clipboard API — reliable on tablets/mobile over HTTPS
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) { /* fall through to legacy path */ }

            // Legacy fallback for older browsers
            try {
                const ta = document.getElementById('storyText');
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, ta.value.length);
                return document.execCommand('copy');
            } catch (e) {
                return false;
            }
        }

        async function copyToClipboard() {
            const textarea = document.getElementById('storyText');
            const text = textarea.value;

            if (!text.trim()) {
                showNotification('⚠️ Nothing to copy yet');
                return;
            }

            const ok = await copyText(text);

            if (ok) {
                // Clear the story so the previous one disappears before the next copy
                textarea.value = '';
                showNotification('✅ Copied — ready to paste');
            } else {
                // Copy failed: leave the text selected so they can copy manually
                textarea.focus();
                textarea.select();
                showNotification('⚠️ Press and hold to copy');
            }
        }

        function showNotification(message) {
            // Simple toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.85);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 10000;
                animation: slideUp 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Search event listener
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTemplates(e.target.value);
            });
        });

        // ========================================
        // INITIALIZATION
        // ========================================
        function initializeApp() {
            loadTemplates();

            // Fetch tech name once and cache it (covers new activations and
            // devices activated before tracking existed)
            if (!localStorage.getItem(TRACKING_CONFIG.techNameKey)) {
                const storedKey = getStoredLicense();
                if (storedKey) lookupAndStoreTechName(storedKey);
            }
        }

        // Check license on load
        window.addEventListener('load', () => {
            if (checkLicense()) {
                document.getElementById('licenseOverlay').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                initializeApp();
            }
        });
    </script>
</body>
</html>
