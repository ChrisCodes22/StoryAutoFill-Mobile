<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Story Template Autosuggest - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .textarea-container {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            resize: vertical;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .templates-list {
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .template-item {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: rgba(102, 126, 234, 0.1);
        }

        .template-item:last-child {
            border-bottom: none;
        }

        .template-item:active {
            background: #f8f9fa;
        }

        .template-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .template-preview {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .license-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .license-modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .license-modal h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .license-modal p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .license-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .license-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .license-error {
            color: #dc3545;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- License Overlay -->
    <div id="licenseOverlay" class="license-overlay">
        <div class="license-modal">
            <h2>🔐 License Required</h2>
            <p>Please enter your license key to use Story Template Autosuggest</p>
            <input type="text" id="licenseInput" class="license-input" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX-XXXX" maxlength="34">
            <div id="licenseError" class="license-error"></div>
            <button class="btn" onclick="activateLicense()">Activate</button>
            <p style="margin-top: 20px; font-size: 12px; color: #999; text-align: center;">
                Contact info@blustacklabs.software for a license key
            </p>
        </div>
    </div>

    <!-- Main App (Hidden until licensed) -->
    <div id="mainApp" class="hidden">
        <div class="container">
            <div class="header">
                <h1>⚡ Story Template</h1>
                <p>Tap a template to copy or insert</p>
            </div>

            <div class="card">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="templateCount">0</div>
                        <div class="stat-label">Templates</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="searchResults">0</div>
                        <div class="stat-label">Results</div>
                    </div>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search templates...">
                </div>

                <div class="templates-list" id="templatesList"></div>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 15px; color: #333;">Your Story</h3>
                <div class="textarea-container">
                    <textarea id="storyText" placeholder="Tap a template above to insert it here..."></textarea>
                </div>
                <button class="btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // LICENSE SYSTEM (HEX-ENCODED)
        // ========================================
        const LICENSE_CONFIG = {
            licenseKey: 'stl_mobile_license',
            encryptionSalt: 'STL2026'
        };

        function encryptKey(key) {
            return btoa(key.split('').reverse().join(''));
        }

        function decryptKey(encrypted) {
            try {
                return atob(encrypted).split('').reverse().join('');
            } catch {
                return null;
            }
        }

        function validateLicenseKey(key) {
            if (!key || typeof key !== 'string') {
                return { valid: false, reason: 'Invalid key format' };
            }

            const cleanKey = key.replace(/-/g, '').toUpperCase();
            
            // Must be exactly 28 hex characters (0-9, A-F)
            if (!/^[A-F0-9]{28}$/.test(cleanKey)) {
                return { valid: false, reason: 'Invalid key format. Key must be 28 hex characters (0-9, A-F).' };
            }

            try {
                // Decode from hex
                let decoded = '';
                for (let i = 0; i < cleanKey.length; i += 2) {
                    const hex = cleanKey.substr(i, 2);
                    decoded += String.fromCharCode(parseInt(hex, 16));
                }
                
                // Expected format: "JOH:1739318400"
                if (!decoded.includes(':')) {
                    return { valid: false, reason: 'Invalid license key structure' };
                }

                const parts = decoded.split(':');
                const userId = parts[0];
                const expiryStr = parts[1];
                
                if (!userId || userId.length < 2) {
                    return { valid: false, reason: 'Invalid license key' };
                }

                // Parse expiry timestamp
                let expiryDate;
                
                if (/^\d+$/.test(expiryStr)) {
                    expiryDate = new Date(parseInt(expiryStr) * 1000);
                } else {
                    expiryDate = new Date(expiryStr);
                }
                
                if (isNaN(expiryDate.getTime())) {
                    return { valid: false, reason: 'Invalid license expiration date' };
                }

                const now = new Date();
                
                if (expiryDate < now) {
                    return { 
                        valid: false, 
                        reason: 'License expired on ' + expiryDate.toLocaleDateString(),
                        expiry: expiryDate, 
                        userId: userId 
                    };
                }

                return { 
                    valid: true, 
                    userId: userId, 
                    expiry: expiryDate 
                };

            } catch (e) {
                console.error('License validation error:', e);
                return { valid: false, reason: 'Invalid license key data' };
            }
        }

        function storeLicense(key) {
            localStorage.setItem(LICENSE_CONFIG.licenseKey, encryptKey(key));
        }

        function getStoredLicense() {
            const encrypted = localStorage.getItem(LICENSE_CONFIG.licenseKey);
            return encrypted ? decryptKey(encrypted) : null;
        }

        function checkLicense() {
            const stored = getStoredLicense();
            
            if (!stored) {
                return false;
            }

            const validation = validateLicenseKey(stored);
            
            if (!validation.valid) {
                localStorage.removeItem(LICENSE_CONFIG.licenseKey);
                return false;
            }

            console.log('License valid until:', validation.expiry.toLocaleDateString());
            return true;
        }

        function activateLicense() {
            const input = document.getElementById('licenseInput');
            const error = document.getElementById('licenseError');
            const key = input.value.replace(/-/g, '').toUpperCase();
            
            if (key.length !== 28) {
                error.textContent = '❌ License key must be 28 characters';
                error.style.display = 'block';
                input.style.borderColor = '#dc3545';
                return;
            }

            const validation = validateLicenseKey(key);
            
            if (validation.valid) {
                storeLicense(input.value);
                document.getElementById('licenseOverlay').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                initializeApp();
            } else {
                error.textContent = `❌ ${validation.reason}`;
                error.style.display = 'block';
                input.style.borderColor = '#dc3545';
            }
        }

        // Format license input
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('licenseInput');
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^A-F0-9]/gi, '').toUpperCase();
                if (value.length > 28) value = value.substring(0, 28);
                
                // Format as XXXXXX-XXXXXX-XXXXXX-XXXXXX-XXXX
                let formatted = '';
                for (let i = 0; i < value.length; i++) {
                    if (i === 6 || i === 12 || i === 18 || i === 24) formatted += '-';
                    formatted += value[i];
                }
                
                e.target.value = formatted;
                e.target.style.borderColor = '#e0e0e0';
                document.getElementById('licenseError').style.display = 'none';
            });
        });

        // ========================================
        // TEMPLATE SYSTEM
        // ========================================
        let templates = [];
        let filteredTemplates = [];

        async function loadTemplates() {
            try {
                const response = await fetch('https://templates.bluestacklabs.software/templates.json');
                const data = await response.json();
                templates = data.templates;
                filteredTemplates = templates;
                console.log('Loaded', templates.length, 'templates');
                updateStats();
                renderTemplates();
            } catch (error) {
                console.error('Failed to load templates:', error);
                document.getElementById('templatesList').innerHTML = '<div class="empty-state">❌ Failed to load templates</div>';
            }
        }

        function searchTemplates(query) {
            if (!query) {
                filteredTemplates = templates;
            } else {
                const q = query.toLowerCase();
                filteredTemplates = templates.filter(t => 
                    t.title.toLowerCase().includes(q) ||
                    t.keywords.some(k => k.toLowerCase().includes(q)) ||
                    t.body.toLowerCase().includes(q)
                );
            }
            updateStats();
            renderTemplates();
        }

        function renderTemplates() {
            const list = document.getElementById('templatesList');
            
            if (filteredTemplates.length === 0) {
                list.innerHTML = '<div class="empty-state">No templates found</div>';
                return;
            }

            list.innerHTML = filteredTemplates.map(template => `
                <div class="template-item" onclick="insertTemplate('${template.title.replace(/'/g, "\\'")}')">
                    <div class="template-title">${template.title}</div>
                    <div class="template-preview">${template.body.substring(0, 80)}...</div>
                </div>
            `).join('');
        }

        function insertTemplate(title) {
            const template = templates.find(t => t.title === title);
            if (!template) return;

            const textarea = document.getElementById('storyText');
            const currentValue = textarea.value;
            
            if (currentValue) {
                textarea.value = currentValue + '\n\n' + template.body;
            } else {
                textarea.value = template.body;
            }

            // Scroll to textarea
            textarea.scrollIntoView({ behavior: 'smooth' });
            
            // Show feedback
            showNotification('✅ Template inserted!');
        }

        function updateStats() {
            document.getElementById('templateCount').textContent = templates.length;
            document.getElementById('searchResults').textContent = filteredTemplates.length;
        }

        function copyToClipboard() {
            const textarea = document.getElementById('storyText');
            
            if (!textarea.value) {
                showNotification('⚠️ Nothing to copy');
                return;
            }

            textarea.select();
            document.execCommand('copy');
            
            showNotification('✅ Copied to clipboard!');
        }

        function showNotification(message) {
            // Simple toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.85);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 10000;
                animation: slideUp 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Search event listener
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTemplates(e.target.value);
            });
        });

        // ========================================
        // INITIALIZATION
        // ========================================
        function initializeApp() {
            loadTemplates();
        }

        // Check license on load
        window.addEventListener('load', () => {
            if (checkLicense()) {
                document.getElementById('licenseOverlay').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                initializeApp();
            }
        });
    </script>
</body>
</html>
